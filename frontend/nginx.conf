# Serves the built UI and forwards /api to the API container, so the browser sees one
# origin and the SameSite=Strict session cookie works without CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints asset file names, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/accounts/:slug, /methodology) all load index.html.
  location / {
    try_files $uri /index.html;
  }
}
